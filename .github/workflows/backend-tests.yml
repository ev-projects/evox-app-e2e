name: Backend Tests

on:
  pull_request:
    branches:
      - master
      - develop
      - main

jobs:
  backend-tests:

    runs-on: self-hosted

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Display workspace
        run: |
          pwd
          ls -la

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: |
          mkdir -p reports

          vendor/bin/phpunit \
            --testsuite FeatureRoot \
            --coverage-html reports \
            --coverage-clover reports/coverage.xml

      - name: Check coverage
        run: php scripts/checkCoverage.php