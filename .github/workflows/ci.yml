name: EVOX Test Suite

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]   # staging deploy trigger — see the deploy job's `if:` below
  schedule:
    - cron: '0 18 * * *'   # nightly full run - adjust to your timezone

# Only one self-hosted runner services this repo. Without this, every push to a PR
# branch queues its own full run behind whatever's already running/queued instead of
# replacing it — if the runner is ever offline for a while, pushes pile up and get
# worked through one stale run at a time once it's back. This cancels a still-running
# or still-queued run for the same workflow+ref as soon as a newer one exists for it.
# Scheduled (cron) runs get their own ref-independent group so a nightly run is never
# cancelled by, or cancels, PR activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -- server/ --------------------------------------------─
      # Plain `composer` here - the Linux staging runner's default composer
      # is already 1.10.27, unlike the old Windows laptop runner which
      # needed a separate composer1.phar to avoid Laravel 5.7's Composer 2
      # PackageManifest.php crash (Issue 4). If this ever moves to a runner
      # where the default composer is v2, that same crash will resurface -
      # see the deploy job's version guard for the same check applied there.
      - name: Install backend dependencies
        working-directory: server
        run: composer install --no-interaction --prefer-dist

      - name: Write server/.env
        working-directory: server
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i '/^DB_HOST=/d;/^DB_PORT=/d;/^DB_DATABASE=/d;/^DB_USERNAME=/d;/^DB_PASSWORD=/d;/^DB_EVOX_LOGS_HOST=/d;/^DB_EVOX_LOGS_PORT=/d;/^DB_EVOX_LOGS_DATABASE=/d;/^DB_EVOX_LOGS_USERNAME=/d;/^DB_EVOX_LOGS_PASSWORD=/d;/^BIO_DB_HOST=/d;/^BIO_DB_PORT=/d;/^BIO_DB_DATABASE=/d;/^BIO_DB_USERNAME=/d;/^BIO_DB_PASSWORD=/d' .env
          # .env.example has no trailing newline, so appending without one first
          # glues the first key onto the last existing line (e.g. GOOGLE_REDIRECT=...DB_HOST=...)
          printf '\n' >> .env
          cat >> .env <<EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_EVOX_LOGS_HOST=${{ secrets.DB_EVOX_LOGS_HOST }}
          DB_EVOX_LOGS_PORT=${{ secrets.DB_EVOX_LOGS_PORT }}
          DB_EVOX_LOGS_DATABASE=${{ secrets.DB_EVOX_LOGS_DATABASE }}
          DB_EVOX_LOGS_USERNAME=${{ secrets.DB_EVOX_LOGS_USERNAME }}
          DB_EVOX_LOGS_PASSWORD=${{ secrets.DB_EVOX_LOGS_PASSWORD }}
          BIO_DB_HOST=${{ secrets.BIO_DB_HOST }}
          BIO_DB_PORT=${{ secrets.BIO_DB_PORT }}
          BIO_DB_DATABASE=${{ secrets.BIO_DB_DATABASE }}
          BIO_DB_USERNAME=${{ secrets.BIO_DB_USERNAME }}
          BIO_DB_PASSWORD=${{ secrets.BIO_DB_PASSWORD }}
          EOF

      # -- client/ --------------------------------------------─
      - name: Install frontend dependencies
        working-directory: client
        run: |
          npm ci --legacy-peer-deps
          npx playwright install chromium

      - name: Write client/.env.e2e
        working-directory: client
        run: |
          cat > .env.e2e <<EOF
          PLAYWRIGHT_BASE_URL=https://evoxtest.eastvantage.com
          E2E_API_KEY=${{ secrets.E2E_API_KEY }}
          E2E_PASSWORD=${{ secrets.E2E_PASSWORD }}
          E2E_USER_EMPLOYEE_PHILIPPINES=${{ secrets.E2E_USER_EMPLOYEE_PHILIPPINES }}
          E2E_USER_SUPERVISOR_PHILIPPINES=${{ secrets.E2E_USER_SUPERVISOR_PHILIPPINES }}
          E2E_USER_HR_PHILIPPINES=${{ secrets.E2E_USER_HR_PHILIPPINES }}
          E2E_USER_PAYROLL_PHILIPPINES=${{ secrets.E2E_USER_PAYROLL_PHILIPPINES }}
          E2E_USER_EMPLOYEE_INDIA=${{ secrets.E2E_USER_EMPLOYEE_INDIA }}
          E2E_USER_SUPERVISOR_INDIA=${{ secrets.E2E_USER_SUPERVISOR_INDIA }}
          E2E_USER_HR_INDIA=${{ secrets.E2E_USER_HR_INDIA }}
          E2E_USER_PAYROLL_INDIA=${{ secrets.E2E_USER_PAYROLL_INDIA }}
          E2E_USER_EMPLOYEE_MOROCCO=${{ secrets.E2E_USER_EMPLOYEE_MOROCCO }}
          E2E_USER_SUPERVISOR_MOROCCO=${{ secrets.E2E_USER_SUPERVISOR_MOROCCO }}
          E2E_USER_HR_MOROCCO=${{ secrets.E2E_USER_HR_MOROCCO }}
          E2E_USER_PAYROLL_MOROCCO=${{ secrets.E2E_USER_PAYROLL_MOROCCO }}
          E2E_USER_ADMIN_PHILIPPINES=${{ secrets.E2E_USER_ADMIN_PHILIPPINES }}
          E2E_USER_HR_HEAD=${{ secrets.E2E_USER_HR_HEAD }}
          E2E_USER_PAYROLL_HEAD=${{ secrets.E2E_USER_PAYROLL_HEAD }}
          EOF

      # -- both, via the existing orchestrator ----------------
      # Coverage (COLLECT_COVERAGE) is reserved for the nightly scheduled run
      # only - Xdebug coverage across the full ~4100-test suite OOM-killed the
      # runner on a regular PR check (see scripts/run-all-tests.sh). The
      # deploy gate only needs the critical-path pass/fail, not coverage.
      - name: Run full suite (PHPUnit -> Playwright -> Jest)
        env:
          COLLECT_COVERAGE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: bash scripts/run-all-tests.sh

      - name: Publish PHPUnit results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: PHPUnit results
          path: coverage/phpunit-results.xml
          reporter: java-junit

      - name: Upload coverage & reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evox-test-reports
          path: coverage/

  # -- CD: staging only (EVOX-18 follow-up) -------------------------------
  # Runs directly on the staging box itself - the self-hosted runner lives
  # on evoxtest.eastvantage.com (10.10.4.24) now, not a separate laptop, so
  # this is local file operations rather than SSH to another machine. See
  # git history for the earlier SSH-based version (used while the runner
  # was still on a Windows laptop, before the runner itself moved here).
  # `needs: test` means a merge with a failing/red check can never reach
  # this job. Fires on push to master (auto) or manual dispatch (both
  # picked deliberately - see conversation). UAT/production are NOT wired up
  # here; this only ever touches the staging deploy path below.
  #
  # `environment: staging` ties this job to the repo's "staging" Environment
  # (Settings -> Environments), which has a required-reviewer rule on it —
  # the job pauses right here for a manual approval before any step below
  # runs. GitHub already refuses to let whoever triggered this run (the PR
  # author, via their merge) approve their own deployment, on top of
  # whatever reviewer team is configured there.
  deploy:
    needs: test
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted]
    environment: staging
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Built in the runner's own throwaway checkout (Node 18.20.8, matches
      # the test job), not in-place in /var/www/html/evox-app-e2e - keeps this
      # workspace separate from the live deploy directory so a build never
      # touches the real app's files until the explicit swap step below.
      # Create React App inlines every REACT_APP_* variable into the JS bundle
      # AT BUILD TIME - if this file doesn't exist before `npm run build`,
      # every process.env.REACT_APP_* reference in the source becomes the
      # literal string "undefined", which is exactly what happened on the
      # first real deploy: every API call went to "/undefined/auth/login"
      # etc., breaking login (and everything else) for every user. This
      # step never existed before - only client/.env.e2e (a different
      # purpose: Playwright config) was ever written. URL/ID values below
      # were extracted directly from the last known-good deployed bundle,
      # not guessed. REACT_APP_API_KEY comes from a repo secret even though
      # CRA ships all of these to every visitor's browser regardless (so
      # none of this is actually secret) - just matching this repo's
      # existing convention for anything credential-shaped.
      - name: Write client/.env
        working-directory: client
        run: |
          cat > .env <<EOF
          REACT_APP_API_BASE_URL=https://evoxtest.eastvantage.com/server/api
          REACT_APP_BACKED_ROOT_URL=https://evoxtest.eastvantage.com/server
          REACT_APP_API_KEY=${{ secrets.REACT_APP_API_KEY }}
          REACT_APP_GOOGLE_ANALYTICS_ID=UA-140684773-2
          REACT_APP_GOOGLE_ANALYTICS_LINK=https://www.googletagmanager.com/gtag/js?id=UA-140684773-2
          REACT_APP_BASE_URL=https://evoxtest.eastvantage.com
          EOF

      - name: Build frontend (static assets)
        working-directory: client
        # react-scripts 3.3.0 (webpack 4) hashes chunks with md4, which OpenSSL 3
        # (default in Node 17+) removed from its default provider - crashes with
        # "error:0308010C:digital envelope routines::unsupported" on Node 18
        # otherwise. Also: GitHub Actions sets CI=true on every runner
        # (self-hosted included) by default, and CRA treats every ESLint
        # warning as a fatal build error under CI=true ("Treating warnings
        # as errors") - the repo has plenty of pre-existing warnings
        # (unused vars etc.), so the build always failed here regardless of
        # the OpenSSL fix. Neither ever surfaced before because this build
        # step only runs in the deploy job, and deploy had never actually
        # triggered until now. CI=false only suppresses that promotion, not
        # ESLint output - warnings still print, they just do not fail the
        # build, matching a normal local `npm run build`.
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          export CI=false
          npm ci --legacy-peer-deps
          npm run build

      # Force-syncs the persistent /var/www/html/evox-app-e2e checkout to exactly
      # origin/master (matches what the test job just tested), then installs
      # backend deps. Guards against the Composer 2 / Laravel 5.7
      # PackageManifest.php crash (Issue 4) by checking the version actually
      # in use there first and failing with a clear message instead of that
      # cryptic crash, in case that ever drifts from the v1.x it is today.
      #
      # Deliberately NOT run here, by explicit decision:
      #   - php artisan migrate - migrations are hand-picked per push; some
      #     existing migration files are outdated or conflict with manual DB
      #     changes on staging. Stays a manual, separate step.
      #   - Any service restart (PHP-FPM/Nginx/queue workers) - not normally
      #     needed after a deploy here, and requires sudo the deploy account
      #     shouldn't need for routine steps.
      #   - Anything touching .env - stays manually managed on staging.
      - name: Deploy backend (sync + composer install)
        run: |
          set -e
          cd /var/www/html/evox-app-e2e
          git fetch origin master
          git checkout -B master origin/master

          cd server
          COMPOSER_VERSION_LINE=$(composer --version 2>&1)
          echo "$COMPOSER_VERSION_LINE"
          if ! echo "$COMPOSER_VERSION_LINE" | grep -qE "Composer version 1\."; then
            echo "ERROR: server composer is not v1.x - refusing to run composer install."
            echo "Laravel 5.7 crashes under Composer 2 (PackageManifest.php: Undefined index name)."
            echo "Point this account's composer at a v1.x binary before retrying."
            exit 1
          fi
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      # Atomic-ish swap: copies the fresh build to build_new alongside the
      # live build/, then mv's old->build_previous and new->build in one go,
      # so Nginx never sees a half-copied directory mid-deploy.
      # build_previous is a cheap one-deploy-deep manual rollback point.
      - name: Deploy frontend (swap in new static build)
        run: |
          set -e
          rm -rf /var/www/html/evox-app-e2e/client/build_new
          cp -r client/build /var/www/html/evox-app-e2e/client/build_new
          cd /var/www/html/evox-app-e2e/client
          rm -rf build_previous
          [ -d build ] && mv build build_previous
          mv build_new build
