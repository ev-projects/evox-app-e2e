name: EVOX Test Suite

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]   # staging deploy trigger — see the deploy job's `if:` below
  schedule:
    - cron: '0 18 * * *'   # nightly full run - adjust to your timezone

# Only one self-hosted runner services this repo. Without this, every push to a PR
# branch queues its own full run behind whatever's already running/queued instead of
# replacing it — if the runner is ever offline for a while, pushes pile up and get
# worked through one stale run at a time once it's back. This cancels a still-running
# or still-queued run for the same workflow+ref as soon as a newer one exists for it.
# Scheduled (cron) runs get their own ref-independent group so a nightly run is never
# cancelled by, or cancels, PR activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -- server/ --------------------------------------------─
      - name: Install backend dependencies
        working-directory: server
        run: php C:/tools/composer1.phar install --no-interaction --prefer-dist

      - name: Write server/.env
        working-directory: server
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i '/^DB_HOST=/d;/^DB_PORT=/d;/^DB_DATABASE=/d;/^DB_USERNAME=/d;/^DB_PASSWORD=/d;/^DB_EVOX_LOGS_HOST=/d;/^DB_EVOX_LOGS_PORT=/d;/^DB_EVOX_LOGS_DATABASE=/d;/^DB_EVOX_LOGS_USERNAME=/d;/^DB_EVOX_LOGS_PASSWORD=/d;/^BIO_DB_HOST=/d;/^BIO_DB_PORT=/d;/^BIO_DB_DATABASE=/d;/^BIO_DB_USERNAME=/d;/^BIO_DB_PASSWORD=/d' .env
          # .env.example has no trailing newline, so appending without one first
          # glues the first key onto the last existing line (e.g. GOOGLE_REDIRECT=...DB_HOST=...)
          printf '\n' >> .env
          cat >> .env <<EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_EVOX_LOGS_HOST=${{ secrets.DB_EVOX_LOGS_HOST }}
          DB_EVOX_LOGS_PORT=${{ secrets.DB_EVOX_LOGS_PORT }}
          DB_EVOX_LOGS_DATABASE=${{ secrets.DB_EVOX_LOGS_DATABASE }}
          DB_EVOX_LOGS_USERNAME=${{ secrets.DB_EVOX_LOGS_USERNAME }}
          DB_EVOX_LOGS_PASSWORD=${{ secrets.DB_EVOX_LOGS_PASSWORD }}
          BIO_DB_HOST=${{ secrets.BIO_DB_HOST }}
          BIO_DB_PORT=${{ secrets.BIO_DB_PORT }}
          BIO_DB_DATABASE=${{ secrets.BIO_DB_DATABASE }}
          BIO_DB_USERNAME=${{ secrets.BIO_DB_USERNAME }}
          BIO_DB_PASSWORD=${{ secrets.BIO_DB_PASSWORD }}
          EOF

      # -- client/ --------------------------------------------─
      - name: Install frontend dependencies
        working-directory: client
        run: |
          npm ci --legacy-peer-deps
          npx playwright install chromium

      - name: Write client/.env.e2e
        working-directory: client
        run: |
          cat > .env.e2e <<EOF
          PLAYWRIGHT_BASE_URL=https://evoxtest.eastvantage.com
          E2E_API_KEY=${{ secrets.E2E_API_KEY }}
          E2E_PASSWORD=${{ secrets.E2E_PASSWORD }}
          E2E_USER_EMPLOYEE_PHILIPPINES=${{ secrets.E2E_USER_EMPLOYEE_PHILIPPINES }}
          E2E_USER_SUPERVISOR_PHILIPPINES=${{ secrets.E2E_USER_SUPERVISOR_PHILIPPINES }}
          E2E_USER_HR_PHILIPPINES=${{ secrets.E2E_USER_HR_PHILIPPINES }}
          E2E_USER_PAYROLL_PHILIPPINES=${{ secrets.E2E_USER_PAYROLL_PHILIPPINES }}
          E2E_USER_EMPLOYEE_INDIA=${{ secrets.E2E_USER_EMPLOYEE_INDIA }}
          E2E_USER_SUPERVISOR_INDIA=${{ secrets.E2E_USER_SUPERVISOR_INDIA }}
          E2E_USER_HR_INDIA=${{ secrets.E2E_USER_HR_INDIA }}
          E2E_USER_PAYROLL_INDIA=${{ secrets.E2E_USER_PAYROLL_INDIA }}
          E2E_USER_EMPLOYEE_MOROCCO=${{ secrets.E2E_USER_EMPLOYEE_MOROCCO }}
          E2E_USER_SUPERVISOR_MOROCCO=${{ secrets.E2E_USER_SUPERVISOR_MOROCCO }}
          E2E_USER_HR_MOROCCO=${{ secrets.E2E_USER_HR_MOROCCO }}
          E2E_USER_PAYROLL_MOROCCO=${{ secrets.E2E_USER_PAYROLL_MOROCCO }}
          E2E_USER_ADMIN_PHILIPPINES=${{ secrets.E2E_USER_ADMIN_PHILIPPINES }}
          E2E_USER_HR_HEAD=${{ secrets.E2E_USER_HR_HEAD }}
          E2E_USER_PAYROLL_HEAD=${{ secrets.E2E_USER_PAYROLL_HEAD }}
          EOF

      # -- both, via the existing orchestrator ----------------
      - name: Run full suite (PHPUnit -> Playwright -> Jest)
        run: bash scripts/run-all-tests.sh

      - name: Publish PHPUnit results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: PHPUnit results
          path: coverage/phpunit-results.xml
          reporter: java-junit

      - name: Upload coverage & reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evox-test-reports
          path: coverage/

  # -- CD: staging only (EVOX-18 follow-up) -------------------------------
  # Skeleton stage: proves SSH auth end-to-end before any real deploy logic
  # is added. `needs: test` means a merge with a failing/red check can never
  # reach this job. Fires on push to master (auto) or manual dispatch (both
  # picked deliberately - see conversation). UAT/production are NOT wired up
  # here; this only ever touches the staging host below.
  #
  # `environment: staging` ties this job to the repo's "staging" Environment
  # (Settings -> Environments), which has a required-reviewer rule on it —
  # the job pauses right here for a manual approval before any step below
  # runs. GitHub already refuses to let whoever triggered this run (the PR
  # author, via their merge) approve their own deployment, on top of
  # whatever reviewer team is configured there.
  deploy:
    needs: test
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted]
    environment: staging
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          ssh-keyscan -H evoxtest.eastvantage.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify SSH connectivity
        run: |
          ssh -i ~/.ssh/staging_deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.STAGING_SSH_USER }}@evoxtest.eastvantage.com" \
            'echo "Connected as $(whoami) on $(hostname)"'

      # Built here (Node 18.20.8 on this runner), not on the server - staging
      # is on Node 10.18.1, which modern react-scripts / npm run build is not
      # expected to run on. Only the finished static output gets shipped over.
      - name: Build frontend (static assets)
        working-directory: client
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # Force-syncs the server's checkout to exactly origin/master (matches
      # what CI just tested), then installs backend deps. Guards against the
      # Composer 2 / Laravel 5.7 PackageManifest.php crash (Issue 4, hit
      # repeatedly on the CI runner earlier in this project) by checking the
      # server's composer version first and failing with a clear message
      # instead of that cryptic crash, since it's unconfirmed which version
      # is installed there.
      #
      # Deliberately NOT run here, by explicit decision:
      #   - php artisan migrate - migrations are hand-picked per push; some
      #     existing migration files are outdated or conflict with manual DB
      #     changes on staging. Stays a manual, separate step.
      #   - Any service restart (PHP-FPM/Nginx/queue workers) - not normally
      #     needed after a deploy here, and requires sudo the deploy account
      #     shouldn't need for routine steps.
      #   - Anything touching .env - stays manually managed on staging.
      - name: Deploy backend (sync + composer install)
        run: |
          ssh -i ~/.ssh/staging_deploy_key "${{ secrets.STAGING_SSH_USER }}@evoxtest.eastvantage.com" '
            set -e
            cd /var/www/evox-app-e2e
            git fetch origin master
            git checkout -B master origin/master

            cd server
            COMPOSER_VERSION_LINE=$(composer --version 2>&1)
            echo "$COMPOSER_VERSION_LINE"
            if ! echo "$COMPOSER_VERSION_LINE" | grep -qE "Composer version 1\."; then
              echo "ERROR: server composer is not v1.x - refusing to run composer install."
              echo "Laravel 5.7 crashes under Composer 2 (PackageManifest.php: Undefined index name)."
              echo "Point this account at a Composer 1.x binary (see the CI runner'"'"'s"
              echo "C:/tools/composer1.phar for the equivalent workaround) before retrying."
              exit 1
            fi
            composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          '

      # Atomic-ish swap: builds to build_new alongside the live build/, then
      # mv's old->build_previous and new->build in one go, so Nginx never
      # sees a half-copied directory mid-deploy. build_previous is a cheap
      # one-deploy-deep manual rollback point (mv build_previous build).
      - name: Deploy frontend (swap in new static build)
        run: |
          ssh -i ~/.ssh/staging_deploy_key "${{ secrets.STAGING_SSH_USER }}@evoxtest.eastvantage.com" \
            'rm -rf /var/www/evox-app-e2e/client/build_new'
          scp -r -i ~/.ssh/staging_deploy_key client/build \
            "${{ secrets.STAGING_SSH_USER }}@evoxtest.eastvantage.com:/var/www/evox-app-e2e/client/build_new"
          ssh -i ~/.ssh/staging_deploy_key "${{ secrets.STAGING_SSH_USER }}@evoxtest.eastvantage.com" '
            set -e
            cd /var/www/evox-app-e2e/client
            rm -rf build_previous
            [ -d build ] && mv build build_previous
            mv build_new build
          '
